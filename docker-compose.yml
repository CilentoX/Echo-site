services:
  web:
    build: .
    image: eco-site:latest
    container_name: eco-site-web
    restart: unless-stopped
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      # HTTP → HTTPS redirect
      - traefik.http.routers.eco-site-http.rule=Host(`ecoapp.litteris.online`)
      - traefik.http.routers.eco-site-http.entrypoints=http
      - traefik.http.routers.eco-site-http.middlewares=eco-site-https-redirect
      - traefik.http.middlewares.eco-site-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.eco-site-https-redirect.redirectscheme.permanent=true
      # HTTPS router
      - traefik.http.routers.eco-site.rule=Host(`ecoapp.litteris.online`)
      - traefik.http.routers.eco-site.entrypoints=https
      - traefik.http.routers.eco-site.tls=true
      - traefik.http.services.eco-site.loadbalancer.server.port=80

networks:
  coolify:
    external: true